name: Build Mac candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit and test
        run: |
          npm audit --audit-level=high
          npm run check
      - name: Build Apple Silicon Mac packages
        run: npm run dist:mac
      - name: Verify packaged app security
        run: npm run verify:packaged -- release/mac-arm64
      - name: Verify Mac packages and generate SHA-256 checksums
        run: |
          version=$(node -p "require('./package.json').version")
          cd release
          app='mac-arm64/微信年轮.app'
          stem="WeChat-Yearbook-${version}-mac-arm64"
          test "$(lipo -archs "$app/Contents/MacOS/微信年轮")" = arm64
          codesign --verify --deep --strict "$app"
          hdiutil verify "$stem.dmg"
          unzip -tq "$stem.zip"
          shasum -a 256 "$stem.dmg" "$stem.zip" > SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release/*-mac-arm64.dmg
            release/*-mac-arm64.zip
      - name: Upload Mac candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wechat-yearbook-mac-arm64-candidate
          path: |
            release/*-mac-arm64.dmg
            release/*-mac-arm64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
